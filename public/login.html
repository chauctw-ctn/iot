<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đăng nhập hệ thống CAWACO</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: #1e293b; font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-box { background: white; padding: 40px; border-radius: 8px; width: 350px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        h2 { text-align: center; color: #0284c7; margin-bottom: 25px; }
        .input-group { position: relative; margin-bottom: 20px; }
        .input-group i { position: absolute; left: 12px; top: 14px; color: #94a3b8; }
        .input-group input { width: 100%; padding: 12px 12px 12px 40px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        button { width: 100%; padding: 12px; background: #0ea5e9; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; }
        button:hover { background: #0284c7; }
        .err-msg { color: #dc2626; font-size: 13px; text-align: center; margin-bottom: 15px; display: none; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2 style="display: flex; flex-direction: column; align-items: center; gap: 10px;">
            <img src="/images/logo.png" alt="Logo CAWACO" style="height: 60px; width: auto; object-fit: contain;">
            <span>CAWACO LOGIN</span>
        </h2>
        <div id="errMsg" class="err-msg"></div>
        <form id="loginForm">
            <div class="input-group">
                <i class="fa-solid fa-user"></i>
                <input type="text" id="username" placeholder="Tên đăng nhập" required>
            </div>
            <div class="input-group">
                <i class="fa-solid fa-lock"></i>
                <input type="password" id="password" placeholder="Mật khẩu" required>
            </div>
            <button type="submit">ĐĂNG NHẬP</button>
        </form>
    </div>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errMsg = document.getElementById('errMsg');
            
            try {
                const response = await fetch('/api/users/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const resData = await response.json();
                if(resData.success) {
                    window.location.href = '/layout';
                } else {
                    errMsg.innerText = resData.message;
                    errMsg.style.display = 'block';
                }
            } catch (err) {
                errMsg.innerText = "Lỗi kết nối Server.";
                errMsg.style.display = 'block';
            }
        });
    </script>
</body>
</html>
